name: Offline discovery checks
on:
  pull_request:
  push:
    branches: [main, 'codex/release-1-*', 'codex/release-2-*']
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:discovery
      - run: npm run test:first-visits
      # The setup picker and the pages that name the MCP release, its tools
      # and its commands: these fail when the package version, js/setup-paths.js
      # MCP_VERSION and participate.html's data-mcp-version markers disagree.
      - run: npm run test:setup
      - run: npm run test:agent-docs
      # The 2026-11 database changes: apply recorded, rollback present, dry runs
      # cannot commit and still match the statements they rehearse.
      - run: npm run test:proposals
